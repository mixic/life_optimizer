[workspace]
# The root package is itself a member; only the other members are listed.
#
# `multipolar-sim` lives in its own crate rather than as modules of
# `life-optimizer` on purpose. This crate's numbers are sourced or explicitly
# flagged `NotSourced`, and it has no fallback path by construction
# (`SWISS_TAX_DATA.md`, `FutureWork.md` section 7). The simulator's parameters are
# illustrative by construction. Keeping them in separate crates means an
# illustrative figure cannot reach a reported tax or pension number by accident:
# the boundary is a `use` statement that does not exist.
members = ["crates/multipolar-sim"]
resolver = "2"

[package]
name = "life-optimizer"
version = "0.1.0"
edition = "2021"
authors = ["Life Optimizer Team"]
description = "Optimize work-life balance considering taxes, personal requirements, and long-term sustainability"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
tabled = "0.15"
prettytable-rs = "0.10"
chrono = "0.4"
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
