[package]
name = "multipolar_sim"
version = "0.1.0"
edition = "2021"
description = "Monte Carlo simulator for a multipolar world: repeated 2x2 games between power blocs, solved for their Nash equilibria, and what they imply for pension security"

# This crate is a workspace member. `[profile.*]` is deliberately absent: Cargo
# only honours profiles declared at the workspace root, and the root's release
# profile already applies here.

[dependencies]
rand = "0.8"
rand_distr = "0.4"
