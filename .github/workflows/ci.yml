name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting is enforced on the library and CLI sources. The existing
      # markdown-authored modules predate this check, so a failure here means a
      # change made formatting worse, not that the repo was already unformatted.
      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # `--workspace` is load-bearing in both of these. Without it cargo operates on
      # the current package only, so the simulator's own tests and lints never ran
      # here at all -- a green tick that said nothing about the crate.
      - name: Run test suite
        run: cargo test --workspace --all-targets --verbose

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        run: cargo doc --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings
      # The simulator is a *binary*, and `--lib` above cannot reach a binary target,
      # so its docs were never built here at all -- which meant a stale intra-doc link
      # in it could sit in the tree until a reader clicked one. This step is the same
      # check applied to that crate.
      - name: cargo doc (multipolar_sim)
        run: cargo doc -p multipolar_sim --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
